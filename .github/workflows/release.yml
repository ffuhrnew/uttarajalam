name: build-and-release

on:
  push:
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: RNode_Firmware_CE

jobs:
  xiao-nrf52840:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RNode_Firmware_CE

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install nRF52 toolchain and libraries
        run: |
          pip install adafruit-nrfutil
          make prep-index
          make prep-xiao_nrf52840

      - name: Build DFU package
        run: make release-xiao_nrf52840

      - name: Create release.json
        run: python3 release_hashes.py > Release/release.json

      - name: Check tag matches firmware version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c "import json;print(next(iter(json.load(open('Release/release.json')).values()))['version'])")
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match firmware version $v from Config.h"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rnode_firmware_xiao_nrf52840
          path: |
            RNode_Firmware_CE/Release/rnode_firmware_xiao_nrf52840.zip
            RNode_Firmware_CE/Release/release.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RNode_Firmware_CE/Release/rnode_firmware_xiao_nrf52840.zip
            RNode_Firmware_CE/Release/release.json
